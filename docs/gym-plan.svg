<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="950" viewBox="0 0 1100 950">
<rect width="1100" height="950" fill="#101b23"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#e5edf2} .small{font-size:16px} .label{font-size:20px;font-weight:600} .note{fill:#9fbbc9;font-size:17px}</style>
<text x="50" y="55" font-size="32" font-weight="700">RED BREACH / GYM 01</text>
<text x="50" y="86" class="note">Top-down plan • 24 × 24 m clear floor • 32 map units = 1 m • north = Godot −Z</text>
<defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#32434c" stroke-width="1"/></pattern></defs>
<rect x="60" y="130" width="600" height="600" fill="url(#grid)" stroke="#92a8b4" stroke-width="8"/>
<text x="350" y="119" class="small">N ↑</text>
<!-- x = 360 + X*25; y = 430 + Z*25 -->
<rect x="110" y="205" width="150" height="75" fill="#24565b" stroke="#79d4d2"/>
<text x="125" y="238" class="small">2 m platform</text>
<rect x="110" y="280" width="50" height="100" fill="#387c82"/>
<path d="M110 292.5h50m-50 12.5h50m-50 12.5h50m-50 12.5h50m-50 12.5h50m-50 12.5h50m-50 12.5h50" stroke="#b2eeeb"/>
<rect x="210" y="280" width="50" height="150" fill="#826233"/>
<path d="M235 415V295m-8 10 8-10 8 10" fill="none" stroke="#f4d291" stroke-width="3"/>
<text x="97" y="460" class="label">01 / MOVEMENT</text>
<text x="100" y="485" class="small">8 × 0.25 m steps / 1:3 ramp</text>
<rect x="335" y="330" width="50" height="25" fill="#935244"/>
<rect x="335" y="405" width="50" height="25" fill="#935244"/>
<text x="310" y="305" class="small">0.75 / 1.25 m cover</text>
<rect x="473" y="180" width="145" height="420" fill="#243b50" fill-opacity="0.55" stroke="#678daa" stroke-dasharray="8 6"/>
<path d="M540 575V230" stroke="#9ebad3" stroke-dasharray="7"/>
<circle cx="510" cy="405" r="12" fill="#df724f"/><circle cx="550" cy="305" r="12" fill="#df724f"/><circle cx="590" cy="205" r="12" fill="#df724f"/>
<text x="492" y="385" class="small">7 m</text><text x="532" y="285" class="small">11 m</text><text x="565" y="185" class="small">15 m</text>
<text x="485" y="628" class="small">03 / TARGET LANE</text>
<path d="M110 530h37.5m25 0H210 M235 530h31.25m37.5 0H335 M360 530h25m50 0H460" stroke="#ad9b75" stroke-width="12"/>
<text x="128" y="563" class="small">1.0 m</text><text x="255" y="563" class="small">1.5 m</text><text x="380" y="563" class="small">2.0 m</text>
<text x="140" y="601" class="label">02 / DOORWAY GAUGES</text>
<circle cx="360" cy="655" r="19" fill="#68c5bc"/><path d="M352 655l8-10 8 10" fill="none" stroke="#163032" stroke-width="3"/>
<text x="320" y="704" class="label">SPAWN</text>
<text x="710" y="163" class="label">FIRST PASS</text>
<text x="710" y="200" class="small"><tspan x="710" dy="0">Walk / sprint / jump / mouse look</tspan><tspan x="710" dy="30">0.6 m wide, 1.8 m tall player</tspan><tspan x="710" dy="30">2.5 m clear doorway height</tspan><tspan x="710" dy="30">Grid textures: 1 m squares</tspan><tspan x="710" dy="30">Static target plates / hit feedback</tspan><tspan x="710" dy="30">Open ceiling, 4 m perimeter walls</tspan></text>
<text x="710" y="425" class="label">LATER GYM MODULES</text>
<text x="710" y="463" class="small"><tspan x="710" dy="0">State Charts door and switch</tspan><tspan x="710" dy="30">Pickups and weapon behavior</tspan><tspan x="710" dy="30">A basic enemy encounter</tspan></text>
<text x="710" y="585" class="label">PURPOSE</text>
<text x="710" y="623" class="small"><tspan x="710" dy="0">Prove the map pipeline and scale.</tspan><tspan x="710" dy="30">No story beats or progression yet.</tspan><tspan x="710" dy="30">Keep this gym for future testing.</tspan></text>
<text x="60" y="795" class="label">SOURCE MAP → BUILD → WALK → EDIT → REBUILD</text>
<text x="60" y="832" class="note">Layout prepared before blockout. TrenchBroom map remains the editable geometry source.</text>
<path d="M60 870h125m-125-6v12m125-12v12" stroke="#e5edf2" stroke-width="2"/><text x="200" y="876" class="small">5 m</text>
</svg>
