<text x="50" y="2196" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="normal" fill="#a9bac9" text-anchor="start">Set the plan with REDBREACH_LIGHT_PLAN before running the bootstrap AND the scene writer — they must agree, or the fittings and the lights end up in different places.</text>
