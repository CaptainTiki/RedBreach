<text x="50" y="88" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="normal" fill="#a9bac9" text-anchor="start">Playtest note: the unlit bays read wrong because the CEILING goes dark, not the wall. Every-bay lighting doubles the fittings, so each one comes down to 0.62 of its energy.</text>
<text x="50" y="114" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="normal" fill="#a9bac9" text-anchor="start">Ceiling and floor figures are mean perceived brightness (0-255) measured on the same frame region in both passes — not an impression.</text>
<text x="50" y="158" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="bold" fill="#e5edf3" text-anchor="start">ALTERNATE — every other bay lit, energy 1.40</text>
