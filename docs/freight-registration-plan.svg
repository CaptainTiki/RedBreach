<text x="744" y="845" fill="#f0f4f7" font-size="17" font-weight="400" text-anchor="start">Entry: kiosks, equipment banks, uprights, beams and real light housings.</text>
<text x="744" y="875" fill="#f0f4f7" font-size="17" font-weight="400" text-anchor="start">Desk: three counter blocks, chairs, screens, sign, canopy and task lights.</text>
<text x="744" y="905" fill="#f0f4f7" font-size="17" font-weight="400" text-anchor="start">Waiting + lounge: seat groups, queue rail, cabinets and wall services.</text>
<text x="744" y="950" fill="#e2c28e" font-size="17" font-weight="700" text-anchor="start">AUTHORING SPLIT</text>
<text x="744" y="980" fill="#afc1cd" font-size="16" font-weight="400" text-anchor="start">TrenchBroom: room shell, partitions, landings and route-defining structure.</text>
<text x="744" y="1008" fill="#afc1cd" font-size="16" font-weight="400" text-anchor="start">Godot prop scenes: reusable cube assemblies with simple collision.</text>
<text x="744" y="1036" fill="#afc1cd" font-size="16" font-weight="400" text-anchor="start">Blender later: replace prop visuals inside those scenes; keep placement.</text>
<text x="744" y="1080" fill="#79e0b8" font-size="17" font-weight="400" text-anchor="start">Readable retreat space stays clear. Detail density lives around it.</text>
<rect x="35" y="1140" width="1630" height="106" fill="#1a2c3c" stroke="none" stroke-width="1"/>
<text x="58" y="1172" fill="#f0f4f7" font-size="19" font-weight="700" text-anchor="start">LATER LAYOUT TOOL: SEE A PLACE → TRAVEL THROUGH OTHER ROOMS → RETURN ABOVE IT</text>
<text x="58" y="1204" fill="#afc1cd" font-size="17" font-weight="400" text-anchor="start">The catwalk has no direct stair from the room below. It reconnects the player visually with earlier space.</text>
<text x="58" y="1230" fill="#afc1cd" font-size="16" font-weight="400" text-anchor="start">Not added to this sample: it needs a reviewed upper route and taller section. Main mission gates remain intact.</text>
