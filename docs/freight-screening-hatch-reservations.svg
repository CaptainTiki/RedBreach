<text x="80" y="829" font-size="16" fill="#adc1d0" font-weight="400">Pink: possible openings. Cyan: reserved emergence floor.</text>
<rect x="742" y="114" width="722" height="739" fill="#1a2c3c" stroke="none" stroke-width="2" stroke-dasharray="" opacity="1"/>
<text x="766" y="158" font-size="23" fill="#ffb6c7" font-weight="700">C1 / CEILING SERVICE HATCH</text>
<text x="766" y="199" font-size="18" fill="#edf4fa" font-weight="400">2.5 × 2.5 m opening, between ribs and fixtures.</text>
<text x="766" y="231" font-size="18" fill="#edf4fa" font-weight="400">Keep a 3 × 3 m landing / emergence area below.</text>
<text x="766" y="263" font-size="18" fill="#edf4fa" font-weight="400">Reserve an overhead service pocket before cutting.</text>
<text x="766" y="295" font-size="18" fill="#edf4fa" font-weight="400">Drop emergence does not require ceiling-crawling AI.</text>
<text x="766" y="365" font-size="23" fill="#ffb6c7" font-weight="700">W1 / NORTH WALL SERVICE HATCH</text>
<text x="766" y="406" font-size="18" fill="#edf4fa" font-weight="400">2.5 × 2.5 m opening beside the storage bank.</text>
<text x="766" y="438" font-size="18" fill="#edf4fa" font-weight="400">Keep the floor in front free of equipment.</text>
<text x="766" y="470" font-size="18" fill="#edf4fa" font-weight="400">A backing service pocket still needs spatial planning.</text>
<text x="766" y="502" font-size="18" fill="#edf4fa" font-weight="400">These are alternatives in one bay, not a paired ambush.</text>
<text x="766" y="573" font-size="21" fill="#edf4fa" font-weight="700">RESERVE THE ENCOUNTER, NOT JUST THE GRATE</text>
<text x="766" y="614" font-size="17" fill="#adc1d0" font-weight="400">Opening + hidden staging + clear landing + escape route.</text>
<text x="766" y="646" font-size="17" fill="#adc1d0" font-weight="400">Check the largest intended bug and its navigation.</text>
<text x="766" y="678" font-size="17" fill="#adc1d0" font-weight="400">Keep a readable hatch cue and distinct ambush screech.</text>
<text x="766" y="710" font-size="17" fill="#adc1d0" font-weight="400">Defer emergence if the player or another bug occupies it.</text>
<text x="766" y="742" font-size="17" fill="#adc1d0" font-weight="400">Floor hatches belong beside routes; keep retreat usable.</text>
<text x="766" y="774" font-size="17" fill="#adc1d0" font-weight="400">Enemy counts, trigger timing and hatch choice come later.</text>
<text x="36" y="901" font-size="20" fill="#edf4fa" font-weight="700">Screening and Registration now share a level floor. Texture changes need a physical edge or seam.</text>
