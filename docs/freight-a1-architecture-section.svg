<circle cx="836.0" cy="356.0" r="12.0" fill="#b8c9d0"/>
<text x="836.0" y="516" fill="#adc1d0" font-size="16" font-weight="400" text-anchor="middle">1.8 m figure</text>
<polyline points="168,530 1268.0,530" fill="none" stroke="#e2b373" stroke-width="2" stroke-dasharray=""/>
<text x="718.0" y="556" fill="#e2b373" font-size="18" font-weight="700" text-anchor="middle">13.75 m existing room width / no room-shell enlargement</text>
<text x="1320" y="236" fill="#edf4fa" font-size="17" font-weight="700" text-anchor="start">Ceiling slab: 3.50 m</text>
<text x="1320" y="275" fill="#edf4fa" font-size="17" font-weight="700" text-anchor="start">Rib underside: 3.25 m</text>
<text x="1320" y="314" fill="#edf4fa" font-size="17" font-weight="700" text-anchor="start">Upper corner begins: 2.95 m</text>
<text x="1320" y="353" fill="#adc1d0" font-size="17" font-weight="400" text-anchor="start">Lower walls stay vertical.</text>
<text x="1320" y="392" fill="#adc1d0" font-size="17" font-weight="400" text-anchor="start">Ribs follow the corner profile.</text>
<text x="1320" y="431" fill="#adc1d0" font-size="17" font-weight="400" text-anchor="start">Structural colour is illustrative;</text>
<text x="1320" y="470" fill="#adc1d0" font-size="17" font-weight="400" text-anchor="start">use the Kenney blockout palette.</text>
<rect x="36" y="604" width="826" height="500" fill="#1a2c3c" stroke="none" stroke-width="1"/>
<text x="60" y="642" fill="#edf4fa" font-size="23" font-weight="700" text-anchor="start">B / SCREENING → STAFF PREPARATION</text>
<rect x="205" y="741.0" width="410" height="287.0" fill="#81b59e" stroke="none" stroke-width="1"/>
<rect x="246.0" y="765.5999999999999" width="328" height="262.40000000000003" fill="#293540" stroke="none" stroke-width="1"/>
<polyline points="246.0,1046 574.0,1046" fill="none" stroke="#e2b373" stroke-width="2" stroke-dasharray=""/>
<text x="410.0" y="1073" fill="#e2b373" font-size="18" font-weight="700" text-anchor="middle">4.0 m clear — existing opening width</text>
<text x="60" y="681" fill="#edf4fa" font-size="19" font-weight="400" text-anchor="start">Deep frame reads as a compartment boundary.</text>
<text x="60" y="715" fill="#adc1d0" font-size="18" font-weight="400" text-anchor="start">0.50 m overall depth; 3.20 m clear headroom.</text>
<text x="410.0" y="896.8" fill="#edf4fa" font-size="21" font-weight="700" text-anchor="middle">OPEN PASSAGE</text>
<text x="410.0" y="929.6" fill="#adc1d0" font-size="16" font-weight="400" text-anchor="middle">Door behaviour remains a later design.</text>
<rect x="886" y="604" width="878" height="500" fill="#1a2c3c" stroke="none" stroke-width="1"/>
<text x="910" y="642" fill="#edf4fa" font-size="23" font-weight="700" text-anchor="start">C / UPPER-CORNER PROFILE + BAY RHYTHM</text>
<rect x="950" y="728" width="246.75" height="246.75" fill="#293540" stroke="none" stroke-width="1"/>
<polyline points="950,974.75 950,728 1196.75,728" fill="none" stroke="#81b59e" stroke-width="6" stroke-dasharray=""/>
<polygon points="950,728 1079.25,728 950,857.25" fill="#8795a0" stroke="none" stroke-width="1"/>
<polyline points="1079.25,734 1079.25,857.25 956,857.25" fill="none" stroke="#e2b373" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="1086.3" y="798.5" fill="#e2b373" font-size="16" font-weight="400" text-anchor="start">0.55 m</text>
<text x="978.2" y="908.95" fill="#edf4fa" font-size="16" font-weight="400" text-anchor="start">45° upper insert</text>
<text x="1240" y="762" fill="#edf4fa" font-size="17" font-weight="700" text-anchor="start">Four rib stations:</text>
<text x="1240" y="796" fill="#edf4fa" font-size="17" font-weight="400" text-anchor="start">3.75 / 3.75 / 3.75 m apart.</text>
<text x="1240" y="830" fill="#edf4fa" font-size="17" font-weight="400" text-anchor="start">Each rib: 0.25 m wide/deep.</text>
<text x="1240" y="864" fill="#adc1d0" font-size="17" font-weight="400" text-anchor="start">Interrupt legs and corner inserts</text>
<text x="1240" y="898" fill="#adc1d0" font-size="17" font-weight="400" text-anchor="start">at existing doorway apertures.</text>
<text x="1240" y="932" fill="#adc1d0" font-size="17" font-weight="400" text-anchor="start">Service trunk occupies the north bay;</text>
<text x="1240" y="966" fill="#adc1d0" font-size="17" font-weight="400" text-anchor="start">light housings mark the workstations.</text>
<text x="910" y="1022" fill="#edf4fa" font-size="18" font-weight="700" text-anchor="start">This is the visible interior lining and frame language.</text>
<text x="910" y="1054" fill="#adc1d0" font-size="16" font-weight="400" text-anchor="start">It suggests a sealed outer shell; it is not a pressure-vessel design.</text>
<text x="36" y="1156" fill="#edf4fa" font-size="20" font-weight="700" text-anchor="start">BUILD NOW: major frames, upper corners, services, light housings and full equipment compositions.</text>
<text x="36" y="1190" fill="#adc1d0" font-size="18" font-weight="400" text-anchor="start">LATER: panel seams, bolts, small pipes, wear and final meshes. Preserve the 3 m route and 2 m working aisles.</text>
</g></svg>