<text x="98" y="1234" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#e5edf3">Shared gallery / widened to 24 × 6 m</text>
<text x="575" y="1030" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#e5edf3">16 m sample lengths; centres 8 m apart; clear lanes remain 4 m.</text>
<text x="575" y="1064" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#e5edf3">Extra wall depth sits outside the lanes. C’s scenery sits to the east.</text>
<text x="575" y="1098" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#e5edf3">B reserves a sealed overhead hatch between ribs; services stay beside it.</text>
<text x="575" y="1146" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#a9bac9">Images supplied by you guide geometry, not shader imitation.</text>
<text x="575" y="1180" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#a9bac9">A: hanging spine   B: stepped bays   C: window buttresses</text>
<text x="575" y="1214" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#a9bac9">Sketches show profiles at ribs; infill and continuous ducting sit behind.</text>
<text x="45" y="1293" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#a9bac9">REVISION 03 / paper geometry study only · no game-map edits · actual construction and clearance checks follow review</text>
