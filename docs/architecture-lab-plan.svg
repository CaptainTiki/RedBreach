<text x="575" y="516" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#e5edf3">1 m sloped base + vertical wall + two real setbacks.</text>
<text x="575" y="541" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#e5edf3">6.5 m widest shell / 5 m crown / separate columns.</text>
<text x="1105" y="161" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#8dc5f2">C / BUTTRESSED WINDOW BAY</text>
<text x="1105" y="189" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#e5edf3">Splayed base; deep windows; broad knee braces.</text>
