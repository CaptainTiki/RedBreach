<text x="45" y="49" font-family="Segoe UI,Arial,sans-serif" font-size="32" fill="#e5edf3">ARCHITECTURE LAB / SHAPE STUDY 03</text>
<text x="45" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#e5edf3">Same 4 m movement envelope. Three different wall constructions. All proposed dimensions in metres.</text>
<text x="45" y="116" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#a9bac9">Profiles first: solid shell → sloped base → service volume → internal frame. Colour identifies geometry, not final materials.</text>
<text x="45" y="161" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#7ed6bf">A / SUSPENDED SERVICE SPINE</text>
<text x="45" y="189" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#e5edf3">Faceted shell + hanging spine + forked supports.</text>
