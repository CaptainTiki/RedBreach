<text x="45" y="516" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#e5edf3">1.6 m-wide faceted trunk; underside at 3.4 m.</text>
<text x="45" y="541" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#e5edf3">Forked hangers at ribs / paired inset light housings.</text>
<text x="575" y="161" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#efbb75">B / STEPPED SERVICE GALLERY</text>
<text x="575" y="189" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#e5edf3">Wall steps inward beneath a raised ceiling spine.</text>
