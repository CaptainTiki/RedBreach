<text x="605" y="665" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#7ed6bf">01  SHELL PLANES</text>
<text x="605" y="692" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#e5edf3">Separate floor, lower wedges, wall slabs, upper wedges and roof.</text>
<text x="605" y="731" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#efbb75">02  SUSPENDED SPINE</text>
<text x="605" y="758" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#e5edf3">Chamfered trunk, real end caps and two inset light channels.</text>
<text x="605" y="797" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#8dc5f2">03  FORKED SUPPORTS</text>
<text x="605" y="824" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#e5edf3">Angled brush hangers connect each rib to the central trunk.</text>
<text x="605" y="863" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#e5edf3">04  RECESSED INFILL</text>
<text x="605" y="890" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#e5edf3">Set backing behind the frame. Add real lips to vents and windows.</text>
<text x="605" y="923" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#a9bac9">Judge silhouette and shadow under neutral light before adding small detail.</text>
