<text x="68" y="331" font-size="20" fill="#e1ebf0" font-weight="400" text-anchor="start">4  Follow the offset corridor to A7; collect R in its office.</text>
<text x="68" y="368" font-size="20" fill="#e1ebf0" font-weight="400" text-anchor="start">5  Retrace the stairs and leave toward door 2.</text>
