<text x="840" y="416" font-size="13" fill="#acc1cd" font-weight="400" text-anchor="start">Dimensions allow for 0.25 m internal partitions.</text>
<text x="840" y="495" font-size="15" fill="#acc1cd" font-weight="400" text-anchor="start">A staffed intake sequence, with an optional office.</text>
<text x="840" y="524" font-size="15" fill="#acc1cd" font-weight="400" text-anchor="start">Four rooms; clear proportions range from 1.01 to 1.90.</text>
<text x="840" y="553" font-size="15" fill="#acc1cd" font-weight="400" text-anchor="start">All occupied ceilings: +3.5 m above the 0 m floor.</text>
<text x="840" y="582" font-size="15" fill="#acc1cd" font-weight="400" text-anchor="start">The east entry and southwest exit stay in place.</text>
<text x="840" y="611" font-size="15" fill="#acc1cd" font-weight="400" text-anchor="start">New partitions close old gaps; thresholds remain level.</text>
<text x="840" y="640" font-size="15" fill="#acc1cd" font-weight="400" text-anchor="start">One south-facing window bay tests a shallow Mars view.</text>
<text x="840" y="713" font-size="19" fill="#eef4f5" font-weight="700" text-anchor="start">WHAT CHANGES</text>
<text x="840" y="748" font-size="15" fill="#acc1cd" font-weight="400" text-anchor="start">Lower the 8 m room ceiling to a 3.5 m occupied ceiling.</text>
<text x="840" y="779" font-size="15" fill="#acc1cd" font-weight="400" text-anchor="start">Use a screening room and a compact optional office.</text>
<text x="840" y="810" font-size="15" fill="#acc1cd" font-weight="400" text-anchor="start">Counter, workstations, lockers and benches define the jobs.</text>
<text x="840" y="841" font-size="15" fill="#acc1cd" font-weight="400" text-anchor="start">Internal doors are separated from wall junctions.</text>
<text x="840" y="872" font-size="15" fill="#acc1cd" font-weight="400" text-anchor="start">The sealed exterior window has a shallow Mars-view prototype.</text>
<text x="840" y="943" font-size="16" fill="#eef4f5" font-weight="400" text-anchor="start">Openings remain open in the furnishing blockout.</text>
<text x="840" y="971" font-size="15" fill="#acc1cd" font-weight="400" text-anchor="start">Automatic pressure-door behavior is a later pass.</text>
<text x="40" y="1060" font-size="16" fill="#eef4f5" font-weight="400" text-anchor="start">The 52 x 32 m shell remains. Internal openings are 4 m; shell openings remain 6 m.</text>
<text x="40" y="1094" font-size="14" fill="#acc1cd" font-weight="400" text-anchor="start">Built in layout 06. Kenney metric greybox props; walkthrough and progression checks passed.</text>
