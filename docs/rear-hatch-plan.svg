<text x="320" y="574" font-size="16" fill="#ffc779" font-weight="400">Hatch sounds behind-left</text>
<text x="320" y="599" font-size="16" fill="#ffc779" font-weight="400">when facing east into D.</text>
<text x="132" y="670" font-size="15" fill="#a6bfce" font-weight="400">FROM B</text>
<text x="728" y="670" font-size="15" fill="#a6bfce" font-weight="400">ONWARD TO E</text>
<text x="60" y="721" font-size="18" fill="#d8e4ed" font-weight="400">s  Small · 1 hit       R  Regular · 6 hits       P  Spitter · 2 mouth / 6 body</text>
<text x="60" y="752" font-size="14" fill="#9fb8c9" font-weight="400">Teal: advance     Lilac: retreat     Amber: hatch / trigger     Plan coordinates are in metres.</text>
<text x="1020" y="183" font-size="18" fill="#edf3f6" font-weight="700">1  CROSS THE TRIGGER</text>
<text x="1020" y="218" font-size="16" fill="#b5c9d7" font-weight="400">Full-width trigger before the sightline.</text>
<text x="1020" y="243" font-size="16" fill="#b5c9d7" font-weight="400">The rear sequence is now committed.</text>
<text x="1020" y="314" font-size="18" fill="#edf3f6" font-weight="700">2  ROUND THE LEFT CORNER</text>
<text x="1020" y="349" font-size="16" fill="#b5c9d7" font-weight="400">See and engage the five room bugs.</text>
<text x="1020" y="374" font-size="16" fill="#b5c9d7" font-weight="400">Room entry is not required.</text>
<text x="1020" y="445" font-size="18" fill="#edf3f6" font-weight="700">3  HEAR THE HATCH</text>
<text x="1020" y="480" font-size="16" fill="#b5c9d7" font-weight="400">Burst 1.75 seconds after the trigger.</text>
<text x="1020" y="505" font-size="16" fill="#b5c9d7" font-weight="400">One small emerges 0.35 seconds later.</text>
<text x="1020" y="576" font-size="18" fill="#edf3f6" font-weight="700">4  TURN, RETREAT, RE-ENGAGE</text>
<text x="1020" y="611" font-size="16" fill="#b5c9d7" font-weight="400">Address the rear threat or reposition.</text>
<text x="1020" y="636" font-size="16" fill="#b5c9d7" font-weight="400">No door traps you in the fight.</text>
<rect x="1016" y="692" width="368" height="58" fill="#2d4543" stroke="none" stroke-width="3"/>
<text x="1030" y="717" font-size="16" fill="#b5eadb" font-weight="600">TOTAL: 3 smalls + 2 regulars + 1 spitter</text>
<text x="1030" y="741" font-size="15" fill="#b5eadb" font-weight="400">Five preplaced + one delayed rear spawn</text>
<rect x="36" y="801" width="1368" height="154" fill="#1d2d3a" stroke="#344958" stroke-width="3"/>
<text x="60" y="835" font-size="17" fill="#96e4d4" font-weight="700">THE CHECK THAT MATTERS</text>
<text x="60" y="867" font-size="20" fill="#d8e4ed" font-weight="400">Approach, spot a room bug, immediately backpedal: the hatch must still fire.</text>
<text x="60" y="899" font-size="17" fill="#b4c8d7" font-weight="400">Verify sightlines across the corridor width, then test walking, sprinting, ADS and pauses.</text>
<text x="60" y="932" font-size="17" fill="#b4c8d7" font-weight="400">The bend adds 12 m to the marked route: 114 m total. Compare empty traversal again.</text>
