<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1742" height="5310" viewBox="0 0 1742 5310">
<rect width="1742" height="5310" fill="#111b25"/>
<text x="50" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="bold" fill="#e5edf3">ARCHITECTURE LAB / THE CORNER — built</text>
<text x="50" y="90" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="normal" fill="#a9bac9">107.66 m walk in one piece: a 54 m straight, a square 90 (V1), then a 45° leg (V4). No rib sits at any bend.</text>
<text x="50" y="116" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="normal" fill="#a9bac9">473 brushes · 1,268 validation checks, 0 failures · 23 ribs on one 4 m rhythm measured along the centreline, 3 stations skipped inside turns.</text>
<image x="50" y="150" width="810" height="455" xlink:href="file:///C:/Repo/RedBreach/RedBreach/.godot/arch_corner_01_long_straight.png" preserveAspectRatio="xMidYMid slice"/>
<text x="50" y="629" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="normal" fill="#a9bac9">The repetition test — 52 m, nothing in it</text>
<image x="882" y="150" width="810" height="455" xlink:href="file:///C:/Repo/RedBreach/RedBreach/.godot/arch_corner_02_mid_straight.png" preserveAspectRatio="xMidYMid slice"/>
<text x="882" y="629" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="normal" fill="#a9bac9">Half way down. Is the rhythm still saying anything?</text>
<image x="50" y="661" width="810" height="455" xlink:href="file:///C:/Repo/RedBreach/RedBreach/.godot/arch_corner_03_v1_approach.png" preserveAspectRatio="xMidYMid slice"/>
<text x="50" y="1140" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="normal" fill="#a9bac9">V1 approach — the square landing reads as a full stop</text>
<image x="882" y="661" width="810" height="455" xlink:href="file:///C:/Repo/RedBreach/RedBreach/.godot/arch_corner_04_v1_exit.png" preserveAspectRatio="xMidYMid slice"/>
<text x="882" y="1140" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="normal" fill="#a9bac9">V1 — the mitre frames the exit like a portal</text>
